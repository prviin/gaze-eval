[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-eval"
version = "0.1.0"
description = "Evaluation tools for gaze prediction models, including scanpath and saliency-map metrics."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Parvin Emami" }
]
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
scanpath = [
    "multimatch-gaze",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88